<!-- EDIT 2 of 2: everything else on the page comes from here -->
<script>
window.SAMPLE = {
  company: "Two Lane America",                 // as you'd write it in an email
  firstName: "Austin",                           // e.g. "Siobhán" for "Hi Siobhán," (leave "" for no greeting)
  tour: "Route 66: Chicago to St. Louis",                       // e.g. "the Dingle Way, 8 days"
  intro: "We’ve animated the first stretch of Route 66, Chicago to St. Louis, on the old road through Illinois: off the interstate wherever the old alignment still runs, through Wilmington, Dwight, Pontiac, Springfield and Litchfield. Send us your own route and we’ll match it exactly, back roads and all.",
  accent: "#E13A44",                       // the client's brand colour (used for small touches, not the buttons)
  logo: "logo.png",                                // e.g. "logo.png" in this folder; "" shows the company name instead
  media: "https://media.iterramaps.com/samples/two-lane-america/",  // where this prospect's videos are on R2

  videos: [                                // file names in the R2 folder above; poster images stay in this folder
    { src: "wide.mp4",     aspect: "16:9", label: "Widescreen, for your Route 66 tour page and YouTube", poster: "poster.jpg" },
    { src: "vertical.mp4", aspect: "9:16", label: "Vertical, for Instagram and Facebook Reels", poster: "poster-vertical.jpg" },
  ],

  mode: "sale",                            // "feedback": asks for their opinion, no prices (feedback round)
                                           // "sale": shows the offer below, the pricing link and "Email us about the full reel"
  note: "",                                // feedback mode only
  offer: "A video of a whole tour is $179, or $159 each for five or more. Short clips of one day or one leg are $79, or $69 each for five or more: for example, your 13-day Route 66 tour as one video plus a clip for each day would be $1,076.",
  from: "Patrick",                         // signs off the note: "— Patrick at Iterra Maps"
  email: "hello@iterramaps.com",
};
</script>
